name: Bats Tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  bats:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run bats
        run: |
          bats --recursive tests
